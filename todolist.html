<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Tasks - Light Grey To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #6c757d;
            --light-grey: #f8f9fa;
            --medium-grey: #e9ecef;
            --dark-grey: #dee2e6;
            --text-color: #495057;
            --accent-color: #adb5bd;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-grey);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .app-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .app-header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 20px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--dark-grey);
            border-radius: 5px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .add-btn:hover {
            background-color: #5a6268;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 15px;
            background-color: var(--medium-grey);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background-color: var(--dark-grey);
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .task-list {
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--light-grey);
            border-radius: 5px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .task-item:hover {
            background-color: var(--medium-grey);
        }

        .task-checkbox {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--accent-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 5px;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #dc3545;
        }

        .stats-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--dark-grey);
            font-size: 0.9rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .clear-btn:hover {
            color: #5a6268;
            text-decoration: underline;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: var(--accent-color);
        }

        @media (max-width: 500px) {
            .input-section {
                flex-direction: column;
            }
            
            .add-btn {
                justify-content: center;
                padding: 12px;
            }
            
            .filter-section {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fas fa-check-circle"></i> Serene Tasks</h1>
            <p class="subtitle">A calm space for your daily tasks</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <input type="text" id="task-input" placeholder="Add a new task..." class="task-input">
                <button id="add-task-btn" class="add-btn"><i class="fas fa-plus"></i> Add Task</button>
            </div>
            
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            
            <div class="task-list" id="task-list">
                <!-- Tasks will be added here dynamically -->
            </div>
            
            <div class="stats-section">
                <span id="task-count">0 tasks remaining</span>
                <button id="clear-completed" class="clear-btn">Clear Completed</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('task-input');
            const addTaskBtn = document.getElementById('add-task-btn');
            const taskList = document.getElementById('task-list');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clear-completed');
            const taskCount = document.getElementById('task-count');
            
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';
            
            // Initialize the app
            function init() {
                renderTasks();
                updateTaskCount();
                
                // Add event listeners
                addTaskBtn.addEventListener('click', addTask);
                taskInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addTask();
                });
                
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentFilter = this.dataset.filter;
                        renderTasks();
                    });
                });
                
                clearCompletedBtn.addEventListener('click', clearCompletedTasks);
            }
            
            // Add a new task
            function addTask() {
                const taskText = taskInput.value.trim();
                if (taskText === '') return;
                
                const newTask = {
                    id: Date.now(),
                    text: taskText,
                    completed: false
                };
                
                tasks.push(newTask);
                saveTasks();
                renderTasks();
                updateTaskCount();
                
                taskInput.value = '';
                taskInput.focus();
            }
            
            // Render tasks based on current filter
            function renderTasks() {
                taskList.innerHTML = '';
                
                let filteredTasks = tasks;
                if (currentFilter === 'active') {
                    filteredTasks = tasks.filter(task => !task.completed);
                } else if (currentFilter === 'completed') {
                    filteredTasks = tasks.filter(task => task.completed);
                }
                
                if (filteredTasks.length === 0) {
                    const emptyMessage = document.createElement('div');
                    emptyMessage.className = 'empty-message';
                    emptyMessage.textContent = currentFilter === 'all' 
                        ? 'No tasks yet. Add one above!' 
                        : currentFilter === 'active' 
                            ? 'No active tasks' 
                            : 'No completed tasks';
                    taskList.appendChild(emptyMessage);
                    return;
                }
                
                filteredTasks.forEach(task => {
                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item';
                    taskItem.dataset.id = task.id;
                    
                    taskItem.innerHTML = `
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                        <button class="delete-btn"><i class="fas fa-trash-alt"></i></button>
                    `;
                    
                    const checkbox = taskItem.querySelector('.task-checkbox');
                    const deleteBtn = taskItem.querySelector('.delete-btn');
                    const textElement = taskItem.querySelector('.task-text');
                    
                    checkbox.addEventListener('change', function() {
                        task.completed = this.checked;
                        textElement.classList.toggle('completed', this.checked);
                        saveTasks();
                        updateTaskCount();
                        
                        // If we're filtering and this change affects visibility
                        if (currentFilter !== 'all') {
                            setTimeout(() => {
                                renderTasks();
                            }, 300); // Small delay to allow animation
                        }
                    });
                    
                    deleteBtn.addEventListener('click', function() {
                        tasks = tasks.filter(t => t.id !== task.id);
                        saveTasks();
                        renderTasks();
                        updateTaskCount();
                    });
                    
                    taskList.appendChild(taskItem);
                });
            }
            
            // Clear completed tasks
            function clearCompletedTasks() {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                renderTasks();
                updateTaskCount();
            }
            
            // Update task counter
            function updateTaskCount() {
                const activeTasks = tasks.filter(task => !task.completed).length;
                taskCount.textContent = `${activeTasks} ${activeTasks === 1 ? 'task' : 'tasks'} remaining`;
            }
            
            // Save tasks to localStorage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
            
            // Initialize the app
            init();
        });
    </script>
</body>
</html>
