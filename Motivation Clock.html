<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivational Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: rgba(255, 255, 255, 0.7);
            --bg-gradient-1: #1a2a6c;
            --bg-gradient-2: #b21f1f;
            --bg-gradient-3: #fdbb2d;
            --transition-speed: 0.4s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--primary-color);
            overflow: hidden;
            perspective: 1000px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            max-width: 800px;
            width: 90%;
            will-change: transform;
            transform-style: preserve-3d;
        }
        
        .container:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .time {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
        }
        
        .time span {
            display: inline-block;
            min-width: 1.2em;
            text-align: center;
        }
        
        .time .separator {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .date {
            font-size: clamp(1rem, 3vw, 1.5rem);
            opacity: 0.9;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }
        
        .message {
            font-size: clamp(1rem, 3vw, 1.5rem);
            margin-top: 1rem;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 1.5rem;
            transition: all var(--transition-speed) ease;
        }
        
        .quote-container {
            position: relative;
            min-height: 120px;
            margin: 2rem 0;
            overflow: hidden;
        }
        
        .quote {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            line-height: 1.6;
            font-weight: 500;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .quote.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .author {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-style: normal;
            margin-top: 0.5rem;
            opacity: 0.7;
            align-self: flex-end;
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.5s linear;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 8s infinite ease-in-out;
            z-index: -1;
            will-change: transform;
            filter: blur(1px);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(180deg) scale(1.1); }
        }
        
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(180deg);
        }
        
        /* Particle effects */
        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌓</button>
    
    <div class="container">
        <div class="time" id="time">
            <span id="hours">00</span>
            <span class="separator">:</span>
            <span id="minutes">00</span>
            <span class="separator">:</span>
            <span id="seconds">00</span>
        </div>
        <div class="date" id="date">Sunday, March 30, 2025</div>
        <div class="message" id="message">Time is precious, enjoy this moment</div>
        
        <div class="quote-container">
            <div class="quote active" id="quote">
                "The only way to do great work is to love what you do."
                <div class="author">— Steve Jobs</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script>
        // Optimized quote management
        class QuoteManager {
            constructor() {
                this.quotes = [
                    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
                    { text: "Success is not final, failure is not fatal: It is the courage to continue that counts.", author: "Winston Churchill" },
                    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
                    { text: "Your time is limited, don't waste it living someone else's life.", author: "Steve Jobs" },
                    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
                    { text: "Strive not to be a success, but rather to be of value.", author: "Albert Einstein" },
                    { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
                    { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
                    { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
                    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
                    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
                    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
                    { text: "Happiness is not something ready-made. It comes from your own actions.", author: "Dalai Lama" },
                    { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
                    { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
                    { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" }
                ];
                this.currentIndex = 0;
                this.quoteElement = document.getElementById('quote');
                this.quoteContainer = document.querySelector('.quote-container');
            }
            
            getRandomQuote() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * this.quotes.length);
                } while (newIndex === this.currentIndex && this.quotes.length > 1);
                
                this.currentIndex = newIndex;
                return this.quotes[this.currentIndex];
            }
            
            displayQuote(quote) {
                this.quoteElement.classList.remove('active');
                
                setTimeout(() => {
                    this.quoteElement.innerHTML = `"${quote.text}" <div class="author">— ${quote.author}</div>`;
                    this.quoteElement.classList.add('active');
                }, 500);
            }
            
            changeQuote() {
                const quote = this.getRandomQuote();
                this.displayQuote(quote);
            }
        }

        // Theme manager
        class ThemeManager {
            constructor() {
                this.themes = [
                    {
                        name: "Sunset",
                        colors: ["#1a2a6c", "#b21f1f", "#fdbb2d"]
                    },
                    {
                        name: "Ocean",
                        colors: ["#0f2027", "#203a43", "#2c5364"]
                    },
                    {
                        name: "Forest",
                        colors: ["#1e3c00", "#3a7d00", "#a5d000"]
                    },
                    {
                        name: "Sunrise",
                        colors: ["#ff7e5f", "#feb47b", "#ffefd5"]
                    },
                    {
                        name: "Berry",
                        colors: ["#8E2DE2", "#4A00E0", "#9400D3"]
                    }
                ];
                this.currentTheme = 0;
            }
            
            changeTheme() {
                this.currentTheme = (this.currentTheme + 1) % this.themes.length;
                const theme = this.themes[this.currentTheme];
                
                document.documentElement.style.setProperty('--bg-gradient-1', theme.colors[0]);
                document.documentElement.style.setProperty('--bg-gradient-2', theme.colors[1]);
                document.documentElement.style.setProperty('--bg-gradient-3', theme.colors[2]);
                
                // Adjust text color based on theme brightness
                const avgBrightness = theme.colors.reduce((acc, color) => {
                    const rgb = color.match(/\w\w/g).map(x => parseInt(x, 16));
                    return acc + (rgb[0] * 0.299 + rgb[1] * 0.587 + rgb[2] * 0.114);
                }, 0) / theme.colors.length;
                
                const textColor = avgBrightness > 150 ? '#222222' : '#ffffff';
                document.documentElement.style.setProperty('--primary-color', textColor);
                document.documentElement.style.setProperty('--secondary-color', textColor + 'b3');
            }
        }

        // Time manager by Lexan .
        class TimeManager {
            constructor() {
                this.timeElement = document.getElementById('time');
                this.hoursElement = document.getElementById('hours');
                this.minutesElement = document.getElementById('minutes');
                this.secondsElement = document.getElementById('seconds');
                this.dateElement = document.getElementById('date');
                this.messageElement = document.getElementById('message');
                this.progressElement = document.getElementById('progress');
                this.lastMinute = -1;
                this.lastSecond = -1;
            }
            
            updateTime() {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                
                // Only update DOM elements when values change
                if (this.lastSecond !== seconds) {
                    this.hoursElement.textContent = hours.toString().padStart(2, '0');
                    this.minutesElement.textContent = minutes.toString().padStart(2, '0');
                    this.secondsElement.textContent = seconds.toString().padStart(2, '0');
                    this.lastSecond = seconds;
                    
                    // Update progress bar
                    const progress = (seconds / 59) * 100;
                    this.progressElement.style.width = `${progress}%`;
                }
                
                if (this.lastMinute !== minutes) {
                    // Update date
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    this.dateElement.textContent = now.toLocaleDateString('en-US', options);
                    
                    // Update message based on time of day
                    let timeMessage = '';
                    if (hours >= 5 && hours < 12) {
                        timeMessage = "Good morning, seize the day!";
                    } else if (hours >= 12 && hours < 17) {
                        timeMessage = "Good afternoon, stay productive!";
                    } else if (hours >= 17 && hours < 21) {
                        timeMessage = "Good evening, time to unwind.";
                    } else {
                        timeMessage = "Good night, rest well.";
                    }
                    
                    this.messageElement.textContent = timeMessage;
                    this.lastMinute = minutes;
                }
            }
        }

        // Particle effects
        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.maxParticles = 30;
                this.container = document.body;
                this.setup();
            }
            
            setup() {
                // Create floating circles
                for (let i = 0; i < 4; i++) {
                    const circle = document.createElement('div');
                    circle.className = 'circle';
                    
                    // Random properties
                    const size = Math.random() * 100 + 50;
                    const posX = Math.random() * 100;
                    const posY = Math.random() * 100;
                    const delay = Math.random() * 8;
                    const duration = Math.random() * 5 + 8;
                    
                    circle.style.width = `${size}px`;
                    circle.style.height = `${size}px`;
                    circle.style.top = `${posY}%`;
                    circle.style.left = `${posX}%`;
                    circle.style.animationDelay = `${delay}s`;
                    circle.style.animationDuration = `${duration}s`;
                    
                    document.body.appendChild(circle);
                }
                
                // Mouse move particles
                document.addEventListener('mousemove', (e) => {
                    if (this.particles.length < this.maxParticles) {
                        this.createParticle(e.clientX, e.clientY);
                    }
                });
            }
            
            createParticle(x, y) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 15 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x - size/2}px`;
                particle.style.top = `${y - size/2}px`;
                
                // Random animation
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 2 + 1;
                const lifetime = Math.random() * 2000 + 1000;
                
                document.body.appendChild(particle);
                
                let startTime = Date.now();
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / lifetime;
                    
                    if (progress >= 1) {
                        particle.remove();
                        this.particles = this.particles.filter(p => p !== particle);
                        return;
                    }
                    
                    const moveX = Math.cos(angle) * velocity * elapsed / 50;
                    const moveY = Math.sin(angle) * velocity * elapsed / 50;
                    const opacity = 1 - progress;
                    
                    particle.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    particle.style.opacity = opacity;
                    
                    requestAnimationFrame(animate);
                };
                
                this.particles.push(particle);
                requestAnimationFrame(animate);
            }
        }

        // 3D tilt effect
        class TiltEffect {
            constructor() {
                this.container = document.querySelector('.container');
                this.setup();
            }
            
            setup() {
                document.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                    this.container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) scale(1.02)`;
                });
                
                document.addEventListener('mouseleave', () => {
                    this.container.style.transform = 'rotateY(0deg) rotateX(0deg)';
                });
            }
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            const quoteManager = new QuoteManager();
            const timeManager = new TimeManager();
            const themeManager = new ThemeManager();
            const particleSystem = new ParticleSystem();
            const tiltEffect = new TiltEffect();
            
            // Update time immediately and then every second
            timeManager.updateTime();
            setInterval(() => timeManager.updateTime(), 1000);
            
            // Change quote every 30 seconds
            setInterval(() => quoteManager.changeQuote(), 30000);
            
            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                themeManager.changeTheme();
            });
            
            // Add keyboard shortcut for quote change (Q key)
            document.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'q') {
                    quoteManager.changeQuote();
                }
            });
        });
    </script>
</body>
</html>
